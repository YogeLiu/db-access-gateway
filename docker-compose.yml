services:
  control-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${CONTROL_MYSQL_ROOT_PASSWORD:-local-control-root-password}
      MYSQL_DATABASE: gateway
      MYSQL_USER: gateway
      MYSQL_PASSWORD: ${CONTROL_MYSQL_PASSWORD:-local-control-password}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - control-data:/var/lib/mysql

  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      WEB_DIR: /app/web
      CONTROL_DSN: "gateway:${CONTROL_MYSQL_PASSWORD:-local-control-password}@tcp(control-mysql:3306)/gateway?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token-change-before-prod}
      TOKEN_PEPPER: ${TOKEN_PEPPER:-local-token-pepper-change-before-prod-32chars}
    dns:
      - ${GATEWAY_DNS_1:-100.100.100.100}
      - ${GATEWAY_DNS_2:-118.31.177.255}
    depends_on:
      control-mysql:
        condition: service_healthy

volumes:
  control-data:
